# Self-run GUNW generation for the ALOS-2 PALSAR-2 Kujukuri stack — pair template.
#
# Derived from nisar-displacement/configs/insar_gunw_DES118_071_template.yaml
# (the chain validated against the ASF production GUNW in
# reports/2026-08-06-gunw-selfrun-validation.md, isce3 v0.25.16) so the
# ALOS-2 closure network comes from the same processor as the NISAR one.
# Instantiate with tools/make_alos2_network.py; the three brace-delimited
# placeholders are the only per-pair fields.
#
# Deviations from the NISAR template, all forced by the sensor or the data:
#   - Inputs are the FULL JAXA L1.1 CEOS scenes (21184 x 37914 px, ~0.8 Gpx)
#     converted with isce3's bundled share/nisar/examples/alos2_to_nisar_l1.py.
#     That is half a NISAR frame (frequency A: 30400 x 53254 = 1.6 Gpx), so
#     the per-pair cost is ~half of the validated NISAR chain (which ran at
#     ~33 GB RSS / ~150 GB scratch / 75 min CPU). tools/crop_rslc.py exists
#     if a sub-scene is ever wanted; it is not used here.
#   - No water mask, no TEC, no orbit/tropo files: none are distributed for
#     ALOS-2 here; precision orbits are embedded in the RSLC by the converter.
#   - Ionosphere: split_main_band (single 79.4 MHz band; NISAR used
#     main_diff_ms_band across frequencies A/B). Dispersive-filter kernels
#     are scaled so their PHYSICAL size matches the NISAR settings.
#   - Looks are scaled to the 1.43 m x 1.91 m (slant x azimuth) pixels.
#     NOTE: phase_unwrap.range/azimuth_looks are TOTAL looks from the RSLC
#     (unwrap.py re-runs crossmul from the SLCs at those looks), not looks
#     added on top of the RIFG. crossmul 8x12 -> RIFG 11.4 m slant x 22.9 m
#     az (~21 m x 23 m ground; NISAR 5x6 on 3.12 x 4.45 m -> 15.6 x 26.7 m);
#     phase_unwrap 28x36 -> RUNW 40.0 m slant x 68.8 m az (NISAR 13x16 ->
#     40.6 x 71 m), i.e. ~0.8 Mpx to unwrap per pair; GUNW posting 80 m and
#     wrapped 20 m, same as NISAR. The ionosphere chain (ionosphere.py)
#     runs its crossmul at the phase_unwrap looks, so the dispersive-filter
#     kernels below are on a RUNW pixel of nearly the same size as NISAR's
#     and keep the NISAR values.
#   - gpu_enabled true: 66 pairs are only tractable on the GPU, and the
#     CUDA Ampcor path avoids the CPU FFTW_MEASURE run-to-run noise
#     (isce3-benchmark bench#36/#48). All pairs use the same setting.
#
# Container paths (see scripts/run_alos2_network.sh):
#   /data    -> isce3-benchmark/data (RSLCs under ALOS2-kujukuri/rslc)
#   /out     -> isce3-benchmark/data/ALOS2-kujukuri/gunw/<name>
#   /scratch -> local NVMe scratch (per pair)
runconfig:
    name: gunw_alos2_kujukuri_20151020_20180109

    groups:
        pge_name_group:
            pge_name: INSAR_L_PGE

        input_file_group:
            reference_rslc_file: /data/ALOS2-kujukuri/rslc/20151020.h5
            secondary_rslc_file: /data/ALOS2-kujukuri/rslc/20180109.h5

        dynamic_ancillary_file_group:
            dem_file: /data/S1-boso/dem.tif
            dem_file_description: >-
                Copernicus DEM GLO-30 (1 arcsec) mosaic over the Boso peninsula
                staged with dem_stitcher for the Sentinel-1 benchmark;
                referenced to the WGS84 ellipsoid.
            water_mask_file:
            water_mask_file_description:
            orbit_files:
                reference_orbit_file:
                secondary_orbit_file:
            tec_file:
            troposphere_weather_model_files:
                reference_troposphere_file:
                secondary_troposphere_file:

        product_path_group:
            product_path: /out
            scratch_path: /scratch
            sas_output_file: /out/product.h5

        primary_executable:
            product_type: GUNW
            product_version:
                rifg_version: '1.0.11'
                roff_version: '1.0.11'
                runw_version: '1.0.11'
                goff_version: '1.0.11'
                gunw_version: '1.0.11'

        debug_level_group:
            debug_switch: false

        worker:
            intermediate_files_removal_enabled: true
            internet_access: false
            gpu_enabled: true
            gpu_id: 0

        processing:
            process_single_co_pol_offset: true

            input_subset:
                list_of_frequencies:
                    A: [HH]

            geocode:
                x_snap: 80
                y_snap: 80
                output_epsg: 32654
                output_posting:
                    A:
                        x_posting: 80
                        y_posting: 80
                    B:
                        x_posting:
                        y_posting:
                wrapped_interferogram:
                    interp_method: BILINEAR
                    x_snap: 20
                    y_snap: 20
                    output_posting:
                        A:
                            x_posting: 20
                            y_posting: 20
                        B:
                            x_posting:
                            y_posting:
                top_left:
                    y_abs:
                    x_abs:
                bottom_right:
                    y_abs:
                    x_abs:
                lines_per_block: 1000
                interp_method: BILINEAR
                gunw_datasets:
                    connected_components: true
                    coherence_magnitude: true
                    unwrapped_phase: true
                    along_track_offset: true
                    slant_range_offset: true
                    correlation_surface_peak: true

            radar_grid_cubes:
                heights: [-500, 0, 500, 1000, 1500, 2000, 2500, 3000, 3500, 4000,
                          4500, 5000, 5500, 6000, 6500, 7000, 7500, 8000, 8500, 9000]
                output_epsg: 32654
                output_posting:
                    x_posting: 500
                    y_posting: 500
                x_snap: 500
                y_snap: 500
                top_left:
                    y_abs:
                    x_abs:
                bottom_right:
                    y_abs:
                    x_abs:

            bandpass:
                lines_per_block: 1000
                window_function: tukey
                window_shape: 0.25

            ionosphere_phase_correction:
                enabled: true
                lines_per_block: 8000
                spectral_diversity: split_main_band
                list_of_frequencies:
                    A: [HH]
                    B:
                split_range_spectrum:
                    lines_per_block: 2048
                    window_function: tukey
                    window_shape: 0.25
                dispersive_filter:
                    enabled: true
                    filter_mask_type: [coherence, subswath_mask]
                    median_filter_size: 15
                    median_filter_threshold: 0.6
                    filter_coherence_threshold: 0.2
                    filling_method: nearest
                    filling_guide_filter_method: median_gaussian
                    filling_guide_median_size: 3
                    filling_outlier_threshold: 3.5
                    filling_outlier_min_scale: 0.0
                    filling_outlier_mad_scale_factor: 1.4826
                    # Applied on the phase_unwrap-looks grid: NISAR 40.6 x 71 m
                    # vs 40.0 x 68.8 m here, so the NISAR pixel counts carry over.
                    kernel_range: 14
                    kernel_azimuth: 110
                    sigma_range: 4
                    sigma_azimuth: 37
                    filter_iterations: 1
                    unwrap_correction: true
                    min_cluster_pixels: 2
                    bridge_algorithm_enabled: true
                    bridge_radius: 500
                    bridge_erosion_size: 2
                    bridge_minimum_samples: 14
                    bridge_ramp_type:
                    bridge_ramp_maximum_pixel: 1000000.0

            troposphere_delay:
                enabled: false

            geo2rdr:
                threshold: 1.0e-8
                maxiter: 25
                lines_per_block: 1000

            rdr2geo:
                threshold: 1.0e-7
                numiter: 25
                extraiter: 10
                lines_per_block: 1000
                write_x: true
                write_y: true
                write_z: true

            coarse_resample:
                lines_per_tile: 1000
                columns_per_tile: 1000

            dense_offsets:
                enabled: true
                lines_per_block: 1000
                window_range: 64
                window_azimuth: 96
                half_search_range: 32
                half_search_azimuth: 32
                skip_range: 75
                skip_azimuth: 75
                margin: 0
                cross_correlation_domain: frequency
                slc_oversampling_factor: 2
                deramping_method: complex
                deramping_axis: azimuth
                use_gross_offsets: true
                gross_offset_range: 0
                gross_offset_azimuth: 0
                correlation_statistics_zoom: 21
                correlation_surface_zoom: 8
                correlation_surface_oversampling_factor: 16
                correlation_surface_oversampling_method: fft
                windows_batch_range: 10
                windows_batch_azimuth: 1

            offsets_product:
                enabled: false

            rubbersheet:
                enabled: true
                culling_metric: median_filter
                median_filter_size_range: 9
                median_filter_size_azimuth: 9
                threshold: 0.75
                mask_refine_enabled: true
                mask_refine_min_neighbors: 5
                mask_refine_filter_size: 5
                outlier_filling_method: fill_smoothed
                fill_smoothed:
                    iterations: 1
                    kernel_size: 3
                interpolation_method: linear
                azimuth_offset_filter:
                    offsets_filter: none
                    kernel_size: 31
                subswath_mask_apply_enabled: true
                idw_interpolation:
                    power: 2
                    number: 100
                    radius: 200
                offsets_filter: boxcar
                boxcar:
                    filter_size_range: 5
                    filter_size_azimuth: 5
                polyfitting:
                    enabled: true
                    degree: 2
                    critical_value: 0.1
                    samples_along_range: 200
                    samples_along_azimuth: 200

            fine_resample:
                enabled: true
                lines_per_tile: 100
                columns_per_tile: 0

            crossmul:
                range_looks: 8
                azimuth_looks: 12
                flatten: true
                oversample: 2
                lines_per_block: 1024
                common_band_range_filter: false
                common_band_azimuth_filter: false

            filter_interferogram:
                lines_per_block: 100
                filter_type: no_filter
                boxcar:
                    filter_size_range: 9
                    filter_size_azimuth: 9

            baseline:
                mode: top_bottom

            phase_unwrap:
                range_looks: 28
                azimuth_looks: 36
                preprocess_wrapped_phase:
                    enabled: true
                    mask:
                        mask_type: subswath_mask
                        ocean_water_buffer: 1
                        inland_water_buffer: 1
                        outlier_threshold: 0.5
                        median_filter_size: 25
                    filling_enabled: false
                    filling_method: distance_interpolator
                    distance_interpolator:
                        distance: 2
                algorithm: snaphu
                snaphu:
                    cost_mode: smooth
                    initialization_method: mcf
                    min_conncomp_frac: 0.01
                    phase_grad_window: [7, 7]
                    ntiles: [1, 1]
                    nproc: 1
                    tile_cost_thresh: 500
                    min_region_size: 300
                    single_tile_reoptimize: true
                    regrow_conncomps: true
                bridge:
                    enabled: true
                    bridge_radius: 500
                    bridge_erosion_size: 2
                    bridge_minimum_samples: 14
                    bridge_ramp_type:
                    bridge_ramp_maximum_pixel: 1000000.0

            correction_luts:
                solid_earth_tides_enabled: true

        output:
            page_enabled: true
            compression_enabled: true
            compression_level: 1
            chunk_size: [512, 512]
            shuffle: true

        logging:
            path: /out/insar.log
            write_mode: w
