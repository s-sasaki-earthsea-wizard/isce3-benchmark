# RIFG (wrapped interferogram + coherence) for a Capella stripmap SICD pair,
# converted with tools/sicd_to_nisar_rslc.py (bench#54 reinforcement).
#
# Generalised from configs/insar_capella_mexico_city_template.yaml, which stays
# as the record of the Mexico City run; every processing setting is the same.
# Instantiated by scripts/run_capella_pair.sh --pair <name>; placeholders:
#   rifg_capella_niscemi_ld_20260204_20260207_noflat      run tag (also the /out and /scratch leaf)
#   false   true | false  -- processing.crossmul.flatten
#   /data/capella_reinforcement/rslc/20260204183253.h5 /data/capella_reinforcement/rslc/20260207172937.h5 reference / secondary RSLC (container paths)
#   /data/capella_reinforcement/dem_niscemi.tif       DEM (container path), Copernicus DEM GLO-30 (1 arcsec) over Niscemi, bbox 14.20 37.00 14.57 37.29, staged with fetch/fetch_dem_bbox.py (dem_stitcher, ellipsoidal heights). its one-line description
#   32633      UTM EPSG of the scene centre (geocode + radar grid cubes)
#   [-100, 0, 100, 200, 300, 400, 500, 600, 800, 1000]   radar grid cube heights covering the DEM range
#
# Looks stay 5 x 3 on every pair: all Capella stripmap scenes used here have
# the same 0.617 m slant sampling, and the fringe-rate test compares rates in
# RIFG pixels, so one multilook keeps the pairs comparable.
#
# Container paths (see scripts/run_capella_pair.sh):
#   /data    -> isce3-benchmark/data
#   /out     -> <pair out root>/<name>
#   /scratch -> $HOME/scratch/capella/<name>
runconfig:
    name: rifg_capella_niscemi_ld_20260204_20260207_noflat

    groups:
        pge_name_group:
            pge_name: INSAR_L_PGE

        input_file_group:
            reference_rslc_file: /data/capella_reinforcement/rslc/20260204183253.h5
            secondary_rslc_file: /data/capella_reinforcement/rslc/20260207172937.h5

        dynamic_ancillary_file_group:
            dem_file: /data/capella_reinforcement/dem_niscemi.tif
            dem_file_description: >-
                Copernicus DEM GLO-30 (1 arcsec) over Niscemi, bbox 14.20 37.00 14.57 37.29, staged with fetch/fetch_dem_bbox.py (dem_stitcher, ellipsoidal heights).
            water_mask_file:
            water_mask_file_description:
            orbit_files:
                reference_orbit_file:
                secondary_orbit_file:
            tec_file:
            troposphere_weather_model_files:
                reference_troposphere_file:
                secondary_troposphere_file:

        product_path_group:
            product_path: /out
            scratch_path: /scratch
            sas_output_file: /out/product.h5

        primary_executable:
            product_type: RIFG
            product_version:
                rifg_version: '1.0.11'
                roff_version: '1.0.11'
                runw_version: '1.0.11'
                goff_version: '1.0.11'
                gunw_version: '1.0.11'

        debug_level_group:
            debug_switch: false

        worker:
            # Keep the scratch (coregistered SLCs, offsets) so the two
            # flatten variants can be compared on identical inputs.
            intermediate_files_removal_enabled: false
            internet_access: false
            gpu_enabled: true
            gpu_id: 0

        processing:
            process_single_co_pol_offset: true

            input_subset:
                list_of_frequencies:
                    A: [HH]

            geocode:
                x_snap: 20
                y_snap: 20
                output_epsg: 32633
                output_posting:
                    A:
                        x_posting: 20
                        y_posting: 20
                    B:
                        x_posting:
                        y_posting:
                wrapped_interferogram:
                    interp_method: BILINEAR
                    x_snap: 5
                    y_snap: 5
                    output_posting:
                        A:
                            x_posting: 5
                            y_posting: 5
                        B:
                            x_posting:
                            y_posting:
                top_left:
                    y_abs:
                    x_abs:
                bottom_right:
                    y_abs:
                    x_abs:
                lines_per_block: 1000
                interp_method: BILINEAR
                gunw_datasets:
                    connected_components: true
                    coherence_magnitude: true
                    unwrapped_phase: true
                    along_track_offset: true
                    slant_range_offset: true
                    correlation_surface_peak: true

            radar_grid_cubes:
                heights: [-100, 0, 100, 200, 300, 400, 500, 600, 800, 1000]
                output_epsg: 32633
                output_posting:
                    x_posting: 500
                    y_posting: 500
                x_snap: 500
                y_snap: 500
                top_left:
                    y_abs:
                    x_abs:
                bottom_right:
                    y_abs:
                    x_abs:

            bandpass:
                lines_per_block: 1000
                window_function: tukey
                window_shape: 0.25

            ionosphere_phase_correction:
                enabled: false

            troposphere_delay:
                enabled: false

            geo2rdr:
                threshold: 1.0e-8
                maxiter: 25
                lines_per_block: 1000

            rdr2geo:
                threshold: 1.0e-7
                numiter: 25
                extraiter: 10
                lines_per_block: 1000
                write_x: true
                write_y: true
                write_z: true

            coarse_resample:
                lines_per_tile: 1000
                columns_per_tile: 1000

            dense_offsets:
                enabled: true
                lines_per_block: 1000
                window_range: 64
                window_azimuth: 64
                half_search_range: 32
                half_search_azimuth: 32
                skip_range: 64
                skip_azimuth: 64
                margin: 0
                cross_correlation_domain: frequency
                slc_oversampling_factor: 2
                deramping_method: complex
                deramping_axis: azimuth
                use_gross_offsets: true
                gross_offset_range: 0
                gross_offset_azimuth: 0
                correlation_statistics_zoom: 21
                correlation_surface_zoom: 8
                correlation_surface_oversampling_factor: 16
                correlation_surface_oversampling_method: fft
                windows_batch_range: 10
                windows_batch_azimuth: 1

            offsets_product:
                enabled: false

            rubbersheet:
                enabled: true
                culling_metric: median_filter
                median_filter_size_range: 9
                median_filter_size_azimuth: 9
                threshold: 0.75
                mask_refine_enabled: true
                mask_refine_min_neighbors: 5
                mask_refine_filter_size: 5
                outlier_filling_method: fill_smoothed
                fill_smoothed:
                    iterations: 1
                    kernel_size: 3
                interpolation_method: linear
                azimuth_offset_filter:
                    offsets_filter: none
                    kernel_size: 31
                subswath_mask_apply_enabled: true
                idw_interpolation:
                    power: 2
                    number: 100
                    radius: 200
                offsets_filter: boxcar
                boxcar:
                    filter_size_range: 5
                    filter_size_azimuth: 5
                polyfitting:
                    enabled: true
                    degree: 2
                    critical_value: 0.1
                    samples_along_range: 200
                    samples_along_azimuth: 200

            fine_resample:
                enabled: true
                lines_per_tile: 100
                columns_per_tile: 0

            crossmul:
                range_looks: 5
                azimuth_looks: 3
                flatten: false
                oversample: 2
                lines_per_block: 1024
                common_band_range_filter: false
                common_band_azimuth_filter: false

            filter_interferogram:
                lines_per_block: 100
                filter_type: no_filter
                boxcar:
                    filter_size_range: 9
                    filter_size_azimuth: 9

            baseline:
                mode: top_bottom

            phase_unwrap:
                range_looks: 15
                azimuth_looks: 9
                preprocess_wrapped_phase:
                    enabled: true
                    mask:
                        mask_type: subswath_mask
                        ocean_water_buffer: 1
                        inland_water_buffer: 1
                        outlier_threshold: 0.5
                        median_filter_size: 25
                    filling_enabled: false
                    filling_method: distance_interpolator
                    distance_interpolator:
                        distance: 2
                algorithm: snaphu
                snaphu:
                    cost_mode: smooth
                    initialization_method: mcf
                    min_conncomp_frac: 0.01
                    phase_grad_window: [7, 7]
                    ntiles: [1, 1]
                    nproc: 1
                    tile_cost_thresh: 500
                    min_region_size: 300
                    single_tile_reoptimize: true
                    regrow_conncomps: true
                bridge:
                    enabled: true
                    bridge_radius: 500
                    bridge_erosion_size: 2
                    bridge_minimum_samples: 14
                    bridge_ramp_type:
                    bridge_ramp_maximum_pixel: 1000000.0

            correction_luts:
                solid_earth_tides_enabled: false

        output:
            page_enabled: true
            compression_enabled: true
            compression_level: 1
            chunk_size: [512, 512]
            shuffle: true

        logging:
            path: /out/insar.log
            write_mode: w
