# NISAR GCOV bring-up smoke (Stage 2a, issue #18 Step 1 analogue on a real granule).
#
# Input:  real NISAR L1 RSLC over Kyushu / Nansei islands (track 125, frame 17,
#         ascending, L-band DHDH, 2026-07-16). Frequency B only (5 MHz, 80 m
#         posting) to keep the smoke run cheap before the full frequency-A run.
# DEM:    Copernicus GLO-30 stitched via dem_stitcher,
#         bbox (W,S,E,N) = (128.28, 30.03, 131.65, 32.30).
# Geogrid: EPSG 32652 (UTM 52N) at 80 m with 80 m snapping to stay
#         pixel-aligned with the official GCOV reference granule.
# Note:   no TEC file -> ionospheric corrections OFF (official reference has
#         them ON). Expected small geolocation offset; record in comparison.
#
# Unset fields inherit isce3 share/nisar/defaults/gcov.yaml
# (apply_rtc: True, gamma0, area_projection, fullcovariance -> False for
# dual-pol HH/HV).

runconfig:
    name: gcov_workflow_default

    groups:
        pge_name_group:
            pge_name: GCOV_L_PGE

        primary_executable:
            product_type: GCOV

        debug_level_group:
            debug_switch: false

        input_file_group:
            input_file_path: /data/NISAR/RSLC/NISAR_L1_PR_RSLC_025_125_A_017_4005_DHDH_A_20260716T203701_20260716T203721_P05023_N_P_J_001.h5

        dynamic_ancillary_file_group:
            dem_file: /data/NISAR/dem.tif
            dem_file_description: Copernicus GLO-30 (dem_stitcher glo_30, ellipsoidal height)

        product_path_group:
            product_path: /data/NISAR/out_gcov_freqB
            scratch_path: /data/NISAR/out_gcov_freqB/scratch
            sas_output_file: /data/NISAR/out_gcov_freqB/gcov_freqB.h5

        processing:
            input_subset:
                list_of_frequencies:
                    B:

            geocode:
                output_epsg: 32652
                output_posting:
                    A:
                        x_posting:
                        y_posting:
                    B:
                        x_posting: 80.0
                        y_posting: 80.0
                x_snap: 80.0
                y_snap: 80.0
                top_left:
                    y_abs:
                    x_abs:
                bottom_right:
                    y_abs:
                    x_abs:

        worker:
            gpu_enabled: False
