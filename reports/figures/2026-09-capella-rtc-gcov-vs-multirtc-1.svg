<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="612" viewBox="0 0 1000 612"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="1000" height="612" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold">MultiRTC v0.5.4 SicdRzdSlc: sensing start (src/multirtc/sicd.py L168–L175)</text>

  <!-- ================= Panel A: time-reversed ================= -->
  <text x="20" y="60" font-size="14" font-weight="bold">A. TimeCAPoly decreases with column (time-reversed: this scene, and every left-looking one surveyed)</text>

  <!-- annotations above the axis -->
  <text x="250" y="88" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#cf222e">last_col_time = t(N)</text>
  <text x="250" y="104" text-anchor="middle" font-size="11.5" fill="#cf222e">index N: one past the image</text>
  <text x="850" y="96" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12">first_col_time = t(0)</text>
  <path d="M350,138 V130 H850 V138" fill="none" stroke="#0969da" stroke-width="1.2"/>
  <text x="600" y="123" text-anchor="middle" fill="#0969da">image: columns 0 … N−1 (N columns)</text>
  <line x1="262" y1="146" x2="338" y2="146" stroke="#cf222e" stroke-width="1.3" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="300" y="139" text-anchor="middle" font-size="12" fill="#cf222e">Δt = 1/PRF</text>

  <!-- time axis -->
  <line x1="215" y1="160" x2="965" y2="160" stroke="#57606a" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="975" y="182" text-anchor="end" font-size="12" fill="#57606a">time</text>
  <circle cx="250" cy="160" r="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="3,2"/>
  <circle cx="350" cy="160" r="13" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <circle cx="350" cy="160" r="8" fill="#0969da"/>
  <circle cx="450" cy="160" r="8" fill="#0969da"/>
  <rect x="532" y="150" width="36" height="20" fill="#ffffff"/>
  <text x="550" y="166" text-anchor="middle" font-size="16">⋯</text>
  <circle cx="650" cy="160" r="8" fill="#0969da"/>
  <circle cx="750" cy="160" r="8" fill="#0969da"/>
  <circle cx="850" cy="160" r="8" fill="#0969da"/>

  <!-- column labels -->
  <text x="205" y="187" text-anchor="end" font-size="12" fill="#57606a">SICD col</text>
  <text x="250" y="187" text-anchor="middle" fill="#cf222e">N</text>
  <text x="350" y="187" text-anchor="middle">N−1</text>
  <text x="450" y="187" text-anchor="middle">N−2</text>
  <text x="650" y="187" text-anchor="middle">2</text>
  <text x="750" y="187" text-anchor="middle">1</text>
  <text x="850" y="187" text-anchor="middle">0</text>

  <text x="250" y="210" text-anchor="middle" fill="#cf222e" font-family="DejaVu Sans Mono, monospace" font-size="12">min() → sensing_start</text>
  <text x="850" y="210" text-anchor="middle" fill="#57606a" font-family="DejaVu Sans Mono, monospace" font-size="12">max() → sensing_end</text>
  <text x="350" y="232" text-anchor="middle" fill="#1a7f37">should be t(N−1)</text>

  <!-- guides -->
  <g stroke="#d0d7de" stroke-dasharray="2,3">
    <line x1="250" y1="245" x2="250" y2="334"/>
    <line x1="350" y1="245" x2="350" y2="334"/>
    <line x1="450" y1="245" x2="450" y2="334"/>
    <line x1="650" y1="245" x2="650" y2="334"/>
    <line x1="750" y1="245" x2="750" y2="334"/>
    <line x1="850" y1="245" x2="850" y2="334"/>
  </g>

  <!-- row 1: pixel data at its true time -->
  <text x="225" y="270" text-anchor="end" fill="#0969da">pixel data, line k</text>
  <text x="225" y="286" text-anchor="end" font-size="11" fill="#57606a">data[:, ::-1].T: line k = col N−1−k</text>
  <g fill="#ddf4ff" stroke="#0969da" stroke-width="1.2">
    <rect x="330" y="255" width="40" height="26"/>
    <rect x="430" y="255" width="40" height="26"/>
    <rect x="630" y="255" width="40" height="26"/>
    <rect x="730" y="255" width="40" height="26"/>
    <rect x="830" y="255" width="40" height="26"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="350" y="272">0</text>
    <text x="450" y="272">1</text>
    <text x="550" y="273" font-size="16">⋯</text>
    <text x="650" y="272">N−3</text>
    <text x="750" y="272">N−2</text>
    <text x="850" y="272">N−1</text>
  </g>

  <!-- row 2: time MultiRTC assigns to line k -->
  <text x="225" y="320" text-anchor="end" fill="#cf222e">MultiRTC time of line k</text>
  <text x="225" y="336" text-anchor="end" font-size="11" fill="#57606a">sensing_start + k / PRF</text>
  <g fill="#ffebe9" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="4,2">
    <rect x="230" y="302" width="40" height="26"/>
    <rect x="330" y="302" width="40" height="26"/>
    <rect x="530" y="302" width="40" height="26"/>
    <rect x="630" y="302" width="40" height="26"/>
    <rect x="730" y="302" width="40" height="26"/>
  </g>
  <g text-anchor="middle" font-size="12">
    <text x="250" y="319">0</text>
    <text x="350" y="319">1</text>
    <text x="450" y="320" font-size="16">⋯</text>
    <text x="550" y="319">N−3</text>
    <text x="650" y="319">N−2</text>
    <text x="750" y="319">N−1</text>
  </g>

  <text x="20" y="362" font-size="12.5" fill="#cf222e">Every line is stamped one Δt early: the first pixel line (column N−1) gets the time of the non-existent column N.</text>
  <text x="20" y="381" font-size="12.5">→ The geocoded image shifts about one line along track (Col.SS = 1.0625 m; the start-time fix alone moves the predicted offset by 1.07 m).</text>
  <text x="20" y="401" font-size="12" fill="#57606a">Mexico City (C14, L, N = 19191), s after CollectStart: t(N−1) = 0.588534, t(N) = 0.588373, Δt = 1.610e-4 s (PRF 6210.7 Hz).</text>

  <!-- ================= Panel B: time increasing ================= -->
  <text x="20" y="442" font-size="14" font-weight="bold">B. TimeCAPoly increases with column (every right-looking scene surveyed)</text>

  <text x="225" y="470" font-size="12" fill="#1a7f37"><tspan font-family="DejaVu Sans Mono, monospace">first_col_time = t(0) → min() → sensing_start</tspan> ✓</text>
  <text x="850" y="470" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#57606a">last_col_time = t(N)</text>
  <path d="M250,488 V481 H750 V488" fill="none" stroke="#0969da" stroke-width="1.2"/>

  <line x1="215" y1="500" x2="965" y2="500" stroke="#57606a" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="975" y="522" text-anchor="end" font-size="12" fill="#57606a">time</text>
  <circle cx="250" cy="500" r="13" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <circle cx="250" cy="500" r="8" fill="#0969da"/>
  <circle cx="350" cy="500" r="8" fill="#0969da"/>
  <circle cx="450" cy="500" r="8" fill="#0969da"/>
  <rect x="532" y="490" width="36" height="20" fill="#ffffff"/>
  <text x="550" y="506" text-anchor="middle" font-size="16">⋯</text>
  <circle cx="650" cy="500" r="8" fill="#0969da"/>
  <circle cx="750" cy="500" r="8" fill="#0969da"/>
  <circle cx="850" cy="500" r="8" fill="#ffffff" stroke="#57606a" stroke-width="1.6" stroke-dasharray="3,2"/>

  <text x="205" y="527" text-anchor="end" font-size="12" fill="#57606a">SICD col</text>
  <text x="250" y="527" text-anchor="middle">0</text>
  <text x="350" y="527" text-anchor="middle">1</text>
  <text x="450" y="527" text-anchor="middle">2</text>
  <text x="650" y="527" text-anchor="middle">N−2</text>
  <text x="750" y="527" text-anchor="middle">N−1</text>
  <text x="850" y="527" text-anchor="middle" fill="#57606a">N</text>
  <text x="850" y="549" text-anchor="middle" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#57606a">max() → sensing_end</text>

  <text x="20" y="572" font-size="12.5">The extra point lands on the end. It only feeds PRF = N / (t(N) − t(0)) = 1/Δt, which is right; the grid length comes from NumCols.</text>
  <text x="20" y="598" font-size="12.5"><tspan font-weight="bold">Fix (2026-11 patch):</tspan> last_col_time = t(N−1), PRF = (N−1) / (t_end − t_start) → same PRF, and the reversed start becomes t(N−1).</text>
</svg>
