<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="672" viewBox="0 0 1060 672"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328">
  <rect width="1060" height="672" fill="#ffffff"/>
  <defs>
    <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="16" font-weight="bold">MultiRTC v0.5.4 SicdRzdSlc: starting range (src/multirtc/sicd.py L173, L181–L191)</text>

  <!-- ================= Panel A: slant plane through the SCP (schematic, not to scale) ================= -->
  <text x="20" y="56" font-size="14" font-weight="bold">A. Slant plane through the SCP (schematic, not to scale)</text>

  <!-- straight track (tangent at the SCP column's time) -->
  <line x1="40" y1="110" x2="640" y2="110" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="2,3"/>
  <text x="636" y="102" text-anchor="end" font-size="11.5" fill="#57606a">straight track</text>
  <!-- ARP track, bending toward the scene -->
  <path d="M40,190.4 Q340,29.6 640,190.4" fill="none" stroke="#57606a" stroke-width="1.8"/>
  <text x="520" y="204" font-size="12" fill="#57606a">ARP track</text>
  <!-- RGZERO row 0: range R below the ARP track at every column -->
  <path d="M50,485.1 Q340,334.9 630,485.1" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <!-- flat plane through the SCP -->
  <line x1="40" y1="410" x2="640" y2="410" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="352" y="398" font-size="12" fill="#cf222e">flat plane through the SCP (MultiRTC)</text>

  <!-- ranges -->
  <line x1="340" y1="110" x2="340" y2="410" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="348" y="262" font-size="12" fill="#1a7f37">R</text>
  <line x1="60" y1="180.0" x2="60" y2="480.0" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="48" y="330" text-anchor="end" font-size="12" fill="#1a7f37">R</text>
  <line x1="60" y1="180.0" x2="90" y2="410" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="5,3"/>

  <!-- fall: ARP below the straight track -->
  <g stroke="#1f2328" stroke-width="1">
    <line x1="32" y1="110" x2="32" y2="180.0"/>
    <line x1="28" y1="110" x2="36" y2="110"/>
    <line x1="28" y1="180.0" x2="36" y2="180.0"/>
  </g>
  <text x="40" y="150" font-size="12">6.92 m</text>
  <!-- outrun: ARP farther along track than the plane point -->
  <line x1="90" y1="406" x2="90" y2="96" stroke="#8c959f" stroke-dasharray="2,3"/>
  <g stroke="#1f2328" stroke-width="1">
    <line x1="60" y1="88" x2="90" y2="88"/>
    <line x1="60" y1="84" x2="60" y2="92"/>
    <line x1="90" y1="84" x2="90" y2="92"/>
  </g>
  <text x="98" y="92" font-size="12">952 m</text>

  <!-- points -->
  <circle cx="340" cy="110" r="5" fill="#1f2328"/>
  <circle cx="60" cy="180.0" r="5" fill="#1f2328"/>
  <circle cx="620" cy="180.0" r="5" fill="#1f2328"/>
  <circle cx="340" cy="410" r="5" fill="#1a7f37"/>
  <circle cx="60" cy="480.0" r="5" fill="#1a7f37"/>
  <circle cx="620" cy="480.0" r="5" fill="#1a7f37"/>
  <circle cx="90" cy="410" r="5" fill="#cf222e"/>
  <circle cx="590" cy="410" r="5" fill="#cf222e"/>

  <text x="348" y="100" font-size="12">ARP, SCP column</text>
  <text x="98" y="204" font-size="12">ARP, col 0</text>
  <text x="348" y="446" font-size="12" fill="#1a7f37">row 0, SCP column</text>
  <text x="98" y="432" font-size="12">col 0</text>
  <text x="582" y="432" text-anchor="end" font-size="12">col N−1</text>

  <!-- direction key -->
  <g stroke="#57606a" stroke-width="1.2">
    <line x1="470" y1="250" x2="530" y2="250" marker-end="url(#ak)"/>
    <line x1="470" y1="250" x2="470" y2="300" marker-end="url(#ak)"/>
  </g>
  <text x="538" y="254" font-size="11" fill="#57606a">Col.UVectECF (along track)</text>
  <text x="478" y="300" font-size="11" fill="#57606a">Row.UVectECF (line of sight)</text>

  <!-- legend A -->
  <line x1="20" y1="502" x2="48" y2="502" stroke="#1a7f37" stroke-width="2"/>
  <text x="56" y="506" font-size="12">RGZERO row 0: R = 761 275.56 m from the ARP at every column</text>
  <line x1="20" y1="523" x2="48" y2="523" stroke="#cf222e" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="56" y="527" font-size="12">get_starting_range(0): to the flat-plane point, −6.92 + 0.60 = −6.32 m</text>
  <text x="20" y="550" font-size="12">6.92 m: the ARP falls toward the scene, ½ a_LOS Δt², below the straight track</text>
  <text x="20" y="568" font-size="12">952 m: the ARP covers 1.093 m per plane metre and outruns the point (+0.60 m)</text>

  <!-- ================= Panel B: per-column difference ================= -->
  <text x="700" y="56" font-size="14" font-weight="bold">B. get_starting_range(col)</text>
  <text x="700" y="74" font-size="14" font-weight="bold">    − RGZERO row-0 range [m]</text>
  <text x="700" y="94" font-size="12" fill="#57606a">Mexico City C14 (L), NumCols = 19191</text>

  <!-- axes: x = 740 + col/19190*240, y = 130 + (1 - v)*35 -->
  <line x1="740" y1="118" x2="740" y2="415" stroke="#57606a" stroke-width="1.2"/>
  <line x1="740" y1="415" x2="980" y2="415" stroke="#57606a" stroke-width="1.2"/>
  <g font-size="11.5" text-anchor="end" fill="#57606a">
    <text x="733" y="169">0</text>
    <text x="733" y="239">−2</text>
    <text x="733" y="309">−4</text>
    <text x="733" y="379">−6</text>
  </g>
  <g stroke="#57606a">
    <line x1="736" y1="165" x2="740" y2="165"/>
    <line x1="736" y1="235" x2="740" y2="235"/>
    <line x1="736" y1="305" x2="740" y2="305"/>
    <line x1="736" y1="375" x2="740" y2="375"/>
    <line x1="740" y1="415" x2="740" y2="419"/>
    <line x1="860" y1="415" x2="860" y2="419"/>
    <line x1="980" y1="415" x2="980" y2="419"/>
  </g>
  <g font-size="11.5" text-anchor="middle" fill="#57606a">
    <text x="740" y="433">0</text>
    <text x="860" y="433">9595</text>
    <text x="860" y="448">(SCP)</text>
    <text x="980" y="433">19190</text>
  </g>
  <text x="860" y="468" text-anchor="middle" font-size="12" fill="#57606a">SICD column (azimuth)</text>

  <line x1="740" y1="165" x2="980" y2="165" stroke="#1a7f37" stroke-width="2"/>
  <line x1="740" y1="386.3" x2="980" y2="386.3" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,4"/>
  <path d="M740,386.3 Q860,-56.3 980,386.3" fill="none" stroke="#57606a" stroke-width="1.8"/>
  <g fill="#1f2328">
    <circle cx="740" cy="386.3" r="3.5"/>
    <circle cx="800" cy="220.3" r="3.5"/>
    <circle cx="860" cy="165" r="3.5"/>
    <circle cx="920" cy="220.3" r="3.5"/>
    <circle cx="980" cy="386.3" r="3.5"/>
  </g>
  <g font-size="11">
    <text x="746" y="404">−6.323</text>
    <text x="974" y="404" text-anchor="end">−6.324</text>
    <text x="794" y="216" text-anchor="end">−1.581</text>
    <text x="926" y="216">−1.581</text>
    <text x="860" y="155" text-anchor="middle">0.000</text>
  </g>

  <!-- legend B -->
  <line x1="700" y1="496" x2="728" y2="496" stroke="#1a7f37" stroke-width="2"/>
  <text x="736" y="500" font-size="12">RGZERO row 0 (true): one range for all columns</text>
  <line x1="700" y1="517" x2="728" y2="517" stroke="#57606a" stroke-width="1.8"/>
  <text x="736" y="521" font-size="12">get_starting_range(col): flat-plane point</text>
  <line x1="700" y1="538" x2="728" y2="538" stroke="#cf222e" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="736" y="542" font-size="12">the col-0 value, used for the whole grid:</text>
  <text x="736" y="558" font-size="12">starting_range 6.32 m (10.24 samples) short</text>

  <!-- ================= notes ================= -->
  <g font-size="12">
    <text x="20" y="592">• RGZERO / INCA: pixel (row, col) is the point at closest-approach range R_CA_SCP + xrow, reached at time TimeCAPoly(ycol).</text>
    <text x="20" y="610">   Row 0 therefore has one range at every column: R_CA_SCP − (SCPPixel.Row − FirstRow) · Row.SS = 761 275.56 m here.</text>
    <text x="20" y="628">• Second order, from the ECF ARPPoly only (no Earth model): Δt = 1.545 s, a_LOS = 5.80 m/s² → −6.92 m; 1.093 m per plane metre → +0.60 m. Code: −6.323 m.</text>
    <text x="20" y="654" font-size="12.5"><tspan font-weight="bold">Fix (2026-11 patch):</tspan> starting_range = R_CA_SCP − shift[0] · Row.SS, the RGZERO definition, with no plane involved.</text>
  </g>
</svg>
